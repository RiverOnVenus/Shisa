[package]
name = "shisa-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "shisa-agent"
path = "src/main.rs"

[dependencies]
shisa-core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 0.3 speaks zbus directly. The blocking API keeps this agent synchronous,
# and async-io matches the runtime zbus already uses here.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus.workspace = true
