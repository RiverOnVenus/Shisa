[package]
name = "shisa-settings"
version = "0.1.9"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/RiverOnVenus/Shisa"
publish = false

# This package is not part of the repository workspace: it is built with the
# frontend assets and pulled in by the PKGBUILD separately.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
shisa-core = { path = "../../../crates/shisa-core" }
zbus = { version = "5", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
glib = "0.18"

# The same gtk and gdk that tauri links, named directly to reach the window's
# client-side decoration: tauri returns gtk::ApplicationWindow from
# WebviewWindow::gtk_window, and gtk::prelude supplies set_decorated.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[features]
# Embeds the built frontend. Without it the shell expects the Vite dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
