name: Build Arch package

# Releases use the packages workflow, which builds all three distributions
# and attaches their packages together. This workflow stays as a manual
# Arch-only build for testing the PKGBUILD in isolation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare package sources
        run: |
          input="$RUNNER_TEMP/shisa-arch-input"
          packaging/arch/prepare-build.sh --worktree "$input"
      - name: Build and check package in Arch Linux
        run: |
          out="$RUNNER_TEMP/shisa-arch-output"
          mkdir "$out"
          docker run --rm \
            -e MAKEFLAGS="-j$(nproc)" \
            -e CARGO_BUILD_JOBS="$(nproc)" \
            -e PACKAGER="Shisa GitHub Actions" \
            -v "$RUNNER_TEMP/shisa-arch-input:/input:ro" \
            -v "$PWD/.github/scripts/build-arch.sh:/build-arch.sh:ro" \
            -v "$out:/out" \
            archlinux:base-devel bash /build-arch.sh
          find "$out" -mindepth 1 ! -type f -delete
      - uses: actions/upload-artifact@v7
        with:
          name: shisa-arch-x86_64
          path: ${{ runner.temp }}/shisa-arch-output/*.pkg.tar.zst
          if-no-files-found: error
