name: Release notes housekeeping

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: release-notes-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep skip-changelog on release housekeeping pull requests
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title
            const housekeeping = /^(release: |packaging: .*(checksum|release record|record the release)|docs: record .* release)/i
            const label = 'skip-changelog'
            if (!housekeeping.test(title)) {
              // Only a title that was housekeeping is the workflow's label
              // to remove. A label a maintainer added by hand stays.
              const previous = context.payload.changes?.title?.from
              if (context.action === 'edited' && previous && housekeeping.test(previous)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.payload.pull_request.number,
                    name: label,
                  })
                } catch (error) {
                  if (error.status !== 404) throw error
                }
              }
              return
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'ededed',
                description: 'Omit this pull request from generated release notes',
              })
            } catch (error) {
              if (error.status !== 422) throw error
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            })
