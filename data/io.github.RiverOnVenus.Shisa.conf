<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Shisa 的 system bus 策略，安装为 /usr/share/dbus-1/system.d/io.github.RiverOnVenus.Shisa.conf。 -->

  <!-- 只有 root 能拥有这个总线名。 -->
  <policy user="root">
    <allow own="io.github.RiverOnVenus.Shisa"/>
    <allow send_destination="io.github.RiverOnVenus.Shisa"/>
  </policy>

  <!-- 其他用户可以调用方法并接收发来的信号。调用者身份由 shisad 从总线凭据读取，
       每个用户只能看到和修改自己的配置。 -->
  <policy context="default">
    <allow send_destination="io.github.RiverOnVenus.Shisa" send_type="method_call"/>
    <allow receive_sender="io.github.RiverOnVenus.Shisa"/>
  </policy>
</busconfig>
